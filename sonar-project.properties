sonar.organization=dart147
sonar.projectKey=Dart147_SMC
sonar.projectName=Dart147_SMC Project

# ... 下面的掃描範圍設定保持原樣不變 ...

# ==========================================
# 1. 定義掃描範圍 (包含前端與後端)
# ==========================================
sonar.sources=frontend/src,backend
sonar.tests=frontend/src,backend

# ==========================================
# 2. 嚴格區分原始碼與測試碼 (避免 Indexing Twice 錯誤)
# ==========================================
# 告訴 Sonar 哪些檔案是測試檔
sonar.test.inclusions=frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,backend/**/*_test.go

# 必須從原始碼中「排除」測試檔、第三方套件與編譯產物
sonar.exclusions=**/node_modules/**,**/dist/**,**/vendor/**,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,backend/**/*_test.go

# ==========================================
# 3. 指定前後端測試覆蓋率報告路徑
# ==========================================
# 前端 Vitest 輸出的 lcov 路徑
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# 後端 Go 輸出的 coverage.out 路徑
sonar.go.coverage.reportPaths=backend/coverage.out

# 排除不需要計算覆蓋率的檔案：自動產生的 sqlc 程式碼、入口點 wiring、seed script
sonar.coverage.exclusions=backend/internal/db/**,backend/cmd/**,backend/internal/seed/**