name: Frontend Dev

on:
  push:
    branches:
      - main

concurrency: # ensures that only one deployment job runs at a time
  group: smc-deploy-dev-frontend
  cancel-in-progress: false # if a deployment is currently running, dont kill it

jobs:
  Frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lint
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: lint
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Format
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: format
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  Build-and-Push:
    name: Build and Push Dev Image
    runs-on: ubuntu-latest
    needs: [Frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and Push runtime image
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: runtime
          push: true
          pull: true
          no-cache-filters: runtime
          build-args: |
            APK_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            lovetsmc/frontend:dev
            lovetsmc/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  Deploy:
    needs: [Build-and-Push]
    runs-on: ubuntu-latest
    steps:
      - name: Build deploy payload
        id: payload
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            '{
              source: {
                title:  "SMC",
                repo:   $repo,
                branch: $branch,
                commit: $commit
              },
              method: "deploy",
              metadata: {
                project_name: "SMC",
                environment:  "dev",
                component:    "frontend"
              },
              setup: {
                inject_secret: { enable: false }
              },
              post: {
                setup_domain: {
                  enable: false,
                  title:  "Endpoint",
                  name:   "showmeyourcode.online",
                  value:  ""
                },
                notify_discord: {
                  enable:      true,
                  notify_only: true,
                  channel:     "smc-activity"
                }
              }
            }' > payload.json
          echo "Payload:"
          cat payload.json

      - name: Trigger SMC-CD webhook
        run: |
          curl --location --fail-with-body --request POST "${{ secrets.SMC_WEBHOOK_URL }}" \
            --header 'Content-Type: application/json' \
            --header "x-deploy-token: ${{ secrets.SMC_DEPLOY_TOKEN }}" \
            --data @payload.json
