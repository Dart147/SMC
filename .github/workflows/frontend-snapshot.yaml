name: Frontend Snapshot

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, ready_for_review]

concurrency: # 
  group: smc-preview-${{ github.event.number }}-frontend # Groups these jobs by the PR number
  cancel-in-progress: true # if an older build is running for this PR, kill it

jobs:
  Frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lint
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: lint
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Format
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: format
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  Build-and-Push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [Frontend]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image (load locally for /healthz)
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: runtime
          load: true
          pull: true
          no-cache-filters: runtime
          build-args: |
            APK_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          tags: lovetsmc/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run /healthz check
        run: |
          docker run -d --rm -p 8080:80 --name frontend-healthz "lovetsmc/frontend:ci"
          if ! curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz; then
            echo "::group::nginx container logs"
            docker logs frontend-healthz || true
            echo "::endgroup::"
            docker stop frontend-healthz || true
            exit 1
          fi
          docker stop frontend-healthz

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Push runtime image
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: runtime
          push: true
          pull: true
          no-cache-filters: runtime
          build-args: |
            APK_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            lovetsmc/frontend:pr-${{ github.event.number }}
            lovetsmc/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  Deploy:
    needs: [Build-and-Push]
    runs-on: ubuntu-latest
    steps:
      - name: Build deploy payload
        id: payload
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg pr_number "$PR_NUMBER" \
            '{
              source: {
                title:  "SMC",
                repo:   $repo,
                branch: $branch,
                commit: $commit
              },
              method: "deploy",
              metadata: {
                environment: "previews",
                component:   "frontend",
                pr_number:   ($pr_number | tonumber)
              },
              setup: {
                inject_secret: { enable: false }
              },
              post: {
                setup_domain: {
                  enable: false,
                  title:  "Endpoint",
                  name:   "pr-${{ github.event.number }}.showmeyourcode.online",
                  value:  ""
                },
                notify_discord: {
                  enable:      true,
                  notify_only: true,
                  channel:     "smc-activity"
                }
              }
            }' > payload.json
          echo "Payload:"
          cat payload.json

      - name: Trigger SMC-CD webhook
        run: |
          curl --location --fail-with-body --request POST "${{ secrets.SMC_WEBHOOK_URL }}" \
            --header 'Content-Type: application/json' \
            --header "x-deploy-token: ${{ secrets.SMC_DEPLOY_TOKEN }}" \
            --data @payload.json

      - name: Comment preview URL on PR
        if: success() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: snapshot-preview
          message: |
            ## ✅ Snapshot Deployment Ready

            | Item | Value |
            | --- | --- |
            | Status | ![Status](https://img.shields.io/badge/Snapshot-Success-22c55e?style=flat-square) |
            | Preview | [https://pr-${{ github.event.pull_request.number }}.showmeyourcode.online](https://pr-${{ github.event.pull_request.number }}.showmeyourcode.online) |
            | Commit | `${{ github.sha }}` |
            | Triggered by | @${{ github.actor }} |

            [![Open Preview](https://img.shields.io/badge/Open-Preview-0ea5e9?style=for-the-badge)](https://pr-${{ github.event.pull_request.number }}.showmeyourcode.online)
