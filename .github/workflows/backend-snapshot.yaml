name: Backend Snapshot

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main

concurrency:
  group: smc-preview-${{ github.event.number }}-backend # Groups these jobs by the PR number
  cancel-in-progress: true # if an older build is running for this PR, kill it

jobs:
  Backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lint
        uses: docker/build-push-action@v7
        with:
          context: backend/
          file: backend/Dockerfile
          target: lint
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Format
        uses: docker/build-push-action@v7
        with:
          context: backend/
          file: backend/Dockerfile
          target: format
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Sqlc
        uses: docker/build-push-action@v7
        with:
          context: backend/
          file: backend/Dockerfile
          target: sqlc-verify
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          
      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: backend/
          file: backend/Dockerfile
          target: test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  Build-and-Push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [Backend]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Push runtime image
        uses: docker/build-push-action@v7
        with:
          context: backend/
          file: backend/Dockerfile
          target: runtime
          push: true
          pull: true
          no-cache-filters: runtime
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_VERSION=pr-${{ github.event.pull_request.number }}
          tags: |
            lovetsmc/backend:pr-${{ github.event.pull_request.number }}
            lovetsmc/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  Deploy:
    needs: [Build-and-Push]
    runs-on: ubuntu-latest
    steps:
      - name: Build deploy payload
        id: payload
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg pr_number "$PR_NUMBER" \
            '{
              source: {
                title:     "SMC",
                repo:      $repo,
                branch:    $branch,
                commit:    $commit,
                pr_number: $pr_number
              },
              method: "deploy",
              metadata: {
                project_name: "SMC",
                environment:  "snapshot",
                component:    "backend"
              },
              setup: {
                inject_secret: { enable: false }
              },
              post: {
                setup_domain: {
                  enable: false,
                  title:  "Endpoint",
                  name:   "pr-${{ github.event.number }}.showmeyourcode.online",
                  value:  ""
                },
                notify_discord: {
                  enable:      true,
                  notify_only: true,
                  channel:     "smc-activity"
                }
              }
            }' > payload.json
          echo "Payload:"
          cat payload.json

      - name: Trigger SMC-CD webhook
        run: |
          curl --location --fail-with-body --request POST "${{ secrets.SMC_WEBHOOK_URL }}" \
            --header 'Content-Type: application/json' \
            --header "x-deploy-token: ${{ secrets.SMC_DEPLOY_TOKEN }}" \
            --data @payload.json
