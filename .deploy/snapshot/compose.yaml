name: smc-pr-${PR_NUMBER}

# Isolated per-PR preview stack: its own postgres + backend + frontend,
# served at pr-${PR_NUMBER}.${DOMAIN} through the shared smc-traefik edge.
#
# Only the frontend gets a Traefik router; nginx (frontend/nginx.conf)
# proxies /api/* to backend:8081 over the per-PR smc-internal network. backend + postgres stay internal-only.
#
# Compose derives unique names from the
# smc-pr-${PR_NUMBER} project. The frontend still reaches the backend by its Compose service name `backend`.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Ephemeral, project-scoped volume — wiped by cleanup.sh `down -v` on
      # PR close so candidate submissions never linger between previews.
      - smc-pr-postgres-data:/var/lib/postgresql/data
      - ../../backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smc-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 30s

  backend:
    image: lovetsmc/backend:pr-${PR_NUMBER}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DB_HOST=postgres
      - JUDGE_BACKEND=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smc-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    image: lovetsmc/frontend:pr-${PR_NUMBER}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smc-internal
      - smc-traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=smc-traefik"
      - "traefik.http.routers.smc-pr-${PR_NUMBER}.rule=Host(`pr-${PR_NUMBER}.${DOMAIN}`)"
      - "traefik.http.routers.smc-pr-${PR_NUMBER}.entrypoints=websecure"
      - "traefik.http.routers.smc-pr-${PR_NUMBER}.tls=true"
      - "traefik.http.routers.smc-pr-${PR_NUMBER}.tls.certresolver=cloudflare"
      - "traefik.http.services.smc-pr-${PR_NUMBER}.loadbalancer.server.port=80"

networks:
  smc-internal:
    driver: bridge
  smc-traefik:
    external: true

volumes:
  smc-pr-postgres-data:
