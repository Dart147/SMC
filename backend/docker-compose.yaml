version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smc-postgres
    restart: unless-stopped
    # 透過 ${變數名} 讀取 .env 中的值
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Healthcheck 的指令也同步改用變數替換
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s    # 每 3 秒檢查一次
      timeout: 3s     # 超時時間
      retries: 5      # 失敗最多重試 5 次
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smc-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      # DB_HOST 屬於 Docker 內部網路特有設定，保留在這裡覆蓋
      - DB_HOST=postgres 
    # 等 postgres 的狀態變成 "healthy" 才可以啟動後端
    depends_on:
      postgres:
        condition: service_healthy