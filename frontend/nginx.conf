server {
	listen 80;
	server_name _;

	# Docker embedded DNS; lets the backend upstream resolve lazily so
	# nginx boots even when the backend service is absent
	resolver 127.0.0.11 valid=30s ipv6=off;

	root /usr/share/nginx/html;
	index index.html;

	location = /healthz {
		add_header Content-Type text/plain;
		return 200 "ok\n";
	}

	# Same-origin API: forward /api/* to the backend container.
	location /api/ {
		set $backend_upstream "backend:8081";
		proxy_pass http://$backend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Serve built assets with long cache; filenames are hashed by Vite.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Single Page fallback: let the client router handle non-file paths.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
